 podcast e entra in contatto diretto…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/b3dfc6043d59da344e132ebc19d8b4f4.jpg", "u": "puntate/31-strategia-per-facebook.html", "c": [], "k": "comunicazione contentmarketing credibilità facebook imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing"}, {"n": 30, "t": "Fuga da Facebook", "d": "2018-08-20", "s": "L'annuncio di FB è della settimana scorsa: \"A noi di mandare traffico ai vostri siti e brand, non ci interessa. Quello era il passato. Non si torna più indietro.\" Se mantieni una pagina FB te ne sarai accorto da solo. Da Febbraio ad oggi, sono stati solo…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/49d25b4e0a4fd642b90b1c1c031e139f.jpg", "u": "puntate/30-fuga-da-facebook.html", "c": [], "k": "comunicazione contentmarketing credibilità facebook imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing"}, {"n": 29, "t": "Paura di condividere", "d": "2018-08-13", "s": "Condividere spesso viene visto come un rischio... si ha paura che qualcun altro sfrutti o valorizzi ciò che abbiamo trovato, prima (e meglio) di noi. Ma nell'era delle informazioni, dove il loro valore sta nel farle muovere, non nel tenerle nascoste, il non…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/cd255cd3d1561a3daebfbb658808695c.jpg", "u": "puntate/29-paura-di-condividere.html", "c": [], "k": "comunicazione condivisione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing"}, {"n": 28, "t": "Bello o autentico?", "d": "2018-08-06", "s": "Cosa è meglio? Costruire un grande marchio o far apprezzare di più chi c'è dietro? Grande apparenza o grande credibilità? D scrittura socialmedia socialmediamarketing"}, {"n": 4, "t": "Wordpress Si, Wordpress No", "d": "2018-03-02", "s": "E' una buona idea aprire un nuovo sito con WordPress per chi è alle prime armi, non è un tecnico e si occupa di altro? Pro e contro da un punto di vista diverso. Risorse: WordPress Managed Hosting - https://wpdevshed.com/managed-wordpress-hosting/ Pressable…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/0bb3781db26972165c6a4a4ce4fc5b29.jpg", "u": "puntate/4-wordpress-si-wordpress-no.html", "c": [], "k": ""}, {"n": 3, "t": "Facebook - Come promuovere un evento", "d": "2018-03-01", "s": "Riflessioni e suggerimenti per i co-organizzatori del mio prossimo tour \"da Brand a Friend\", su come promuovere al meglio su Facebook uno o più eventi di questo tipo. . Musica: \"Loop\" - David Cutter Music", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/428ba5a911bde3203eef356c5e18cead.jpg", "u": "puntate/3-facebook-come-promuovere-un-evento.html", "c": [], "k": "comunicazione eventi eventmarketing facebook marketing promozione socialmedia strategia"}, {"n": 2, "t": "Facebook cambio di algoritmo: soluzioni", "d": "2018-02-27", "s": "Da metà Gennaio Facebook ha ridotto drasticamente la visibilità dei contenuti provenienti dalle Pagine. Come organizzarsi per fronteggiare le conseguenze negative di questo cambiamento? Gruppi Facebook? *Partcipa anche tu al podcast* Lasciami i tuoi commenti…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/64127b161650bf8eaaf0f5002e2904e6.jpg", "u": "puntate/2-facebook-cambio-di-algoritmo-soluzioni.html", "c": [], "k": "facebook paginefacebook socialmedia strategia"}, {"n": 1, "t": "Introduzione: Perché e per chi è", "d": "2018-02-26", "s": "Introduzione: perché e per chi è questo podcast. Aiutare imprenditori e piccole aziende che desiderano conquistare maggior visibilità e autorevolezza const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const fd=s=>{const[y,m,d]=s.split("-");return d?(+d)+" "+MESI[m-1]+" "+y:s};
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let cat=new URLSearchParams(location.search).get("c")||"";
const q=document.getElementById("q"),grid=document.getElementById("grid");
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const t=norm(q.value);
  const list=D.eps.filter(e=>(!cat||e.c.includes(cat))&&(!t||norm(e.t+" "+e.s+" "+e.k+" #"+e.n).includes(t)));
  document.getElementById("count").textContent=list.length+" puntate";
  document.getElementById("catdesc").textContent=cat&&D.cats[cat]?D.cats[cat].d:"";
  grid.innerHTML=list.map(e=>`<a class="card" href="${e.u}"><img src="${esc(e.i)}" alt="" loading="lazy">
   <div class="b"><div class="meta">#${e.n} · ${fd(e.d)}</div><h3>${esc(e.t)}</h3><p>${esc(e.s)}</p>
   <div class="tags">${e.c.map(c=>`<span class="tag">${esc(D.cats[c].n)}</span>`).join("")}</div></div></a>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===cat));
}
document.getElementById("chips").onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;cat=b.dataset.c;
  history.replaceState(null,"",cat?"?c="+cat:location.pathname);render()};
q.oninput=render;render();
</script></body></html>
