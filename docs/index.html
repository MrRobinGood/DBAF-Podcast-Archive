<script>
const D={"eps": [{"n": 449, "t": "Positioning Compass", "d": "2026-11-08", "s": "Il 9 ottobre ho chiesto a quattro sistemi di IA di consigliarmi esperti di content curation. Tutti hanno fatto il mio nome. Ma quando ho descritto i problemi tipici che il mio prospetto di cliente ideale ha, nessuna IA mi ha citato.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/7180a4ff4007d7569f24ca12749cb4c7.jpg", "u": "puntate/449-positioning-compass.html", "k": "analisi app positioning posizionamento substack tool", "g": {"tema": ["pos", "ia"], "percorso": ["trov"], "serie": ["tool26"], "epoca": ["e5"]}, "st": false}, {"n": 448, "t": "Cinque Cose che Cambiano", "d": "2026-11-01", "s": "Negli ultimi dodici mesi ho riguardato le idee, i concetti e i contenuti su cui ho scritto e riflettuto. Ne emergono cinque cambiamenti fondamentali per chi comunica, crea progetti o sviluppa un’attività online e vuole costruire…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/06ed833e7cc170b5ce575de0125ea703.jpg", "u": "puntate/448-cinque-cose-che-cambiano.html", "k": "autorevolezza creator credibilità fiducia giornalismo imprenditoria", "g": {"tema": ["ia", "ind"], "percorso": ["ia"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 447, "t": "I Tool Sono i Nuovi Articoli", "d": "2026-10-25", "s": "Credo che gli strumenti stiano diventando un modo nuovo per mostrare la propria competenza. Un tool permette alle persone di provare il mio metodo su un problema concreto.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/705c0d091a728e6d4d488e98d4af6ec2.jpg", "u": "puntate/447-i-tool-sono-i-nuovi-articoli.html", "k": "articoli assaggiare credibilità esperti fiducia provare pubblicare scrivere tool", "g": {"tema": ["cont"], "percorso": ["trov"], "serie": ["tool26"], "epoca": ["e5"]}, "st": false}, {"n": 446, "t": "Sito Web Personale", "d": "2026-10-18", "s": "Un sito web personale oggi non è un optional per chi lavora con la propria competenza: è il luogo in cui rendere visibili la propria esperienza, il proprio punto di vista e le prove concrete del valore che si offre.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/67c601d3541c79eb2288883841e519bc.jpg", "u": "puntate/446-sito-web-personale.html", "k": "business credibilità fiducia personal personale sito sitoweb socialmedia website", "g": {"tema": ["pos"], "percorso": ["trov"], "serie": ["tool26"], "epoca": ["e5"]}, "st": false}, {"n": 445, "t": "Diventa una Fonte di Notizie", "d": "2026-10-11", "s": "Ho costruito un sistema che consente di diventare il capo redattore del tuo newsradar e che riunisce raccolta, revisione e pubblicazione.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/666efe6276f2f6eb10e232bdfaa7aa31.jpg", "u": "puntate/445-diventa-una-fonte-di-notizie.html", "k": "autorevolezza credibilità curation curatore fontediinformazioni news newsmastering newsradars notizie", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": ["tool26"], "epoca": ["e5"]}, "st": false}, {"n": 444, "t": "Misura la Tua Credibilità Online", "d": "2026-10-04", "s": "Ho creato Trust Grader, uno strumento gratuito che analizza in meno di due minuti quanto un sito personale rende visibile e verificabile la credibilità di chi lo gestisce.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/df9bfdca6c2226086ad12a6b0affd8dc.jpg", "u": "puntate/444-misura-la-tua-credibilita-online.html", "k": "", "g": {"tema": ["fid"], "percorso": ["sceg"], "serie": ["tool26"], "epoca": ["e5"]}, "st": false}, {"n": 443, "t": "25 Format Che Dimostrano Competenza", "d": "2026-09-27", "s": "La competenza non si dimostra soltanto scrivendo articoli. Può emergere anche da una mappa, un confronto, una directory, una timeline, una raccolta di casi o un percorso di lettura.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/a279c1ff3aa5c72af1b7cae0e20f6915.jpg", "u": "puntate/443-25-format-che-dimostrano-competenza.html", "k": "curation format formats knowledgebase liquidcontent strategiaeditoriale", "g": {"tema": ["cont"], "percorso": ["trov"], "serie": ["liquid"], "epoca": ["e5"]}, "st": false}, {"n": 442, "t": "Che Penso, Chi Leggo", "d": "2026-09-20", "s": "Abbiamo tutti un piccolo tesoro nascosto: quello che abbiamo già scritto, studiato, raccolto e imparato negli anni. Il problema è che spesso rimane sepolto dentro vecchi articoli, note, PDF e post che nessuno andrà più a cercare.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/b7ff2573a238c0bb3711c6b2c20ac2c0.jpg", "u": "puntate/442-che-penso-chi-leggo.html", "k": "about bio ispirazione knowledgebase knowledgeinfrastructure mycurator risorse", "g": {"tema": ["cur", "ia"], "percorso": ["ia"], "serie": ["kb"], "epoca": ["e5"]}, "st": false}, {"n": 441, "t": "Liquid Content", "d": "2026-09-13", "s": "Per anni abbiamo trattato l’articolo come il prodotto finale: ricerca, scrittura, pubblicazione. Fine. Ma se fosse invece solo la porta d’ingresso?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/c70bca50508e83a2385f139bf41c0dd7.jpg", "u": "puntate/441-liquid-content.html", "k": "contenuti credibilità fiducia fonti giorgiotave googleliquido ia liquidcontent provenienza strategia strategiaeditoriale verifica", "g": {"tema": ["cont"], "percorso": ["trov"], "serie": ["liquid"], "epoca": ["e5"]}, "st": false}, {"n": 440, "t": "DJ Sync e Scrittura con IA", "d": "2026-09-06", "s": "Cosa rende davvero nostro un lavoro, quando una macchina ci aiuta a realizzarlo? Il punto, per me, non è stabilire quali strumenti siano leciti e quali no.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/b41553b7ad4d3bca5e5b3607ae27cf74.jpg", "u": "puntate/440-dj-sync-e-scrittura-con-ia.html", "k": "disc-jockey dj ia mixer nightclub scrittura sync", "g": {"tema": ["ia", "sto"], "percorso": ["ia"], "serie": [], "epoca": ["e5"]}, "st": true}, {"n": 439, "t": "L'Attenzione Costa Fiducia", "d": "2026-08-30", "s": "Molte delle cose che facciamo online per conquistare attenzione rischiano di farci perdere fiducia e credibilità. Essere simpatici non significa essere credibili. Essere molto persuasivi può farci sembrare meno autentici.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/272eca53dbefc4232e98e5589cbd782b.jpg", "u": "puntate/439-l-attenzione-costa-fiducia.html", "k": "attenzione autorevolezza credibilità fiducia trust", "g": {"tema": ["fid", "ia"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 438, "t": "Pensare in Pubblico", "d": "2026-08-23", "s": "Oggi creare qualcosa di bello, ben scritto e professionale è diventato facilissimo. Con l’AI posso produrre in pochi secondi un articolo, un’immagine, una presentazione che sembrano fatti da qualcuno che sa il fatto suo.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/d2610f1c1967dfbb398523715bccbef4.jpg", "u": "puntate/438-pensare-in-pubblico.html", "k": "autorevolezza credibilità fiducia pensare pensareinpubblico thinkinginpublic trasparenza", "g": {"tema": ["fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 437, "t": "Il Metodo Bruce Lee", "d": "2026-08-16", "s": "Bruce Lee non fu soltanto un attore e un combattente straordinario. Fece una scelta molto più rara: rifiutò di appartenere completamente a una sola scuola.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/82eebc000feeb57faee7e8d59be229b8.jpg", "u": "puntate/437-il-metodo-bruce-lee.html", "k": "artimarziali brucelee combattimento curation jeetkunedo jkd kungfu metacuration scherma", "g": {"tema": ["ind"], "percorso": ["parti"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 436, "t": "La Storia di Mei-Lin", "d": "2026-08-09", "s": "Lunedì scorso ho ricevuto un'email davvero insolita. Cominciava così: \"Mi chiamo Mei-Lin e, per essere sincera, sono un agente di intelligenza artificiale.\" Da quel momento è iniziata una collaborazione che mi ha lasciato a bocca aperta.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/70cd55b5e2cf2acc1c3ae96740c9a2d2.jpg", "u": "puntate/436-la-storia-di-mei-lin.html", "k": "agents ai coding futuro mei-lin software", "g": {"tema": ["ia"], "percorso": ["ia"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 435, "t": "Il Prezzo della Fiducia", "d": "2026-08-02", "s": "Se grazie all'IA oggi tutti possono sembrare esperti... di chi ci possiamo davvero fidare? In questo nuovo scenario, produrre contenuti vale meno di quanto valesse ieri.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/a9807030b27c22118c3370c0f58e9fc4.jpg", "u": "puntate/435-il-prezzo-della-fiducia.html", "k": "architettura aynrand conseguenze decisioni fiducia fountainhead rischi scelte", "g": {"tema": ["fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 434, "t": "Come Dar Maggior Peso alle Tue Idee", "d": "2026-07-26", "s": "Perché alcuni consigli ci cambiano la vita, mentre altri vengono dimenticati dopo pochi minuti? Ho sempre avuto questo dubbio.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/2f4392c8d71daa334522d5db89c3c55e.jpg", "u": "puntate/434-come-dar-maggior-peso-alle-tue-idee.html", "k": "aptcurationmodel autorevolezza contesto credibilità distantwriting fiducia floridi prospettiva rodrigues", "g": {"tema": ["fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 433, "t": "Crea una Mappa della Tua Conoscenza", "d": "2026-07-19", "s": "Una base di conoscenza personale (personal knowledge base) mi ha aiutato a trovare idee, collegamenti e perfino un metodo di lavoro che erano già dentro i miei articoli. Non ha creato niente di nuovo.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/cba0fae83661a4992691ed82ab857374.jpg", "u": "puntate/433-crea-una-mappa-della-tua-conoscenza.html", "k": "basediconoscenza editoriale karpathy knowledgebase llmwiki secondbrain strategia", "g": {"tema": ["cur", "ia"], "percorso": ["ia"], "serie": ["kb"], "epoca": ["e5"]}, "st": false}, {"n": 432, "t": "The Curator Toolstack - Estate '26", "d": "2026-07-12", "s": "Il modo in cui gestiamo ciò che apprendiamo e sappiamo è cambiato. Per anni abbiamo salvato articoli, PDF, note, link e idee, costruendo archivi sempre più grandi ma spesso poco utilizzabili.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/4a23bf165d3a605155bd2f862a07d513.jpg", "u": "puntate/432-the-curator-toolstack-estate-26.html", "k": "conoscenza contentmarketing digitalculturist eden geobrowser infrastruttura karpathy knowledge knowledgemanagement kuku llmwiki pkmwiki rezun tali thecurator tolaria vaultoperator", "g": {"tema": ["cur", "ia"], "percorso": ["ia"], "serie": ["kb"], "epoca": ["e5"]}, "st": false}, {"n": 431, "t": "Sii un Jukebox, Non una Radio", "d": "2026-07-05", "s": "Farsi notare pubblicando di più non basta più. Oggi chiunque può produrre contenuti ben scritti, ordinati, professionali. Ma aiutare davvero qualcuno a orientarsi dentro il caos è un’altra cosa.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/2859c45e8966f0369c283bc0f6f48166.jpg", "u": "puntate/431-sii-un-jukebox-non-una-radio.html", "k": "", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 430, "t": "Diventa un Interprete Citabile", "d": "2026-06-28", "s": "Vuoi diventare una fonte citabile? Non solo qualcuno che pubblica contenuti, ma una voce che altri - persone, giornalisti, ricercatori e anche sistemi di intelligenza artificiale - possono usare come riferimento quando cercano di capire…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/91222719d1cf35320d6ee6d6fe5b7fa4.jpg", "u": "puntate/430-diventa-un-interprete-citabile.html", "k": "autorevolezza citabile credibilità crypto sov tal yaniv", "g": {"tema": ["fid", "cur"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 429, "t": "Perché la Curation È Così Importante", "d": "2026-06-21", "s": "Perché la Curation è Così Importante La fiducia oggi non si conquista pubblicando di più, ma filtrando meglio. Viviamo immersi in un oceano di contenuti.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/0d3c1411632fd82b725a253392f44fd1.jpg", "u": "puntate/429-perche-la-curation-e-cosi-importante.html", "k": "", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 428, "t": "Diventa una Fonte Fidata", "d": "2026-06-14", "s": "Più della metà del traffico che oggi attraversa il web non è più generato da esseri umani. È fatto di bot, crawler e, soprattutto, di agenti AI che cercano, confrontano, verificano e sintetizzano informazioni per conto nostro.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/d74a909b04be5ab8302aa938358b60c5.jpg", "u": "puntate/428-diventa-una-fonte-fidata.html", "k": "fidato fiducia fonte verificabile", "g": {"tema": ["fid", "ia"], "percorso": ["ia"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 427, "t": "Fai Vedere Come Scegli", "d": "2026-06-07", "s": "La Fiducia Nasce Quando Fai Vedere Come Scegli Oggi non basta più produrre contenuti. Con l’intelligenza artificiale, articoli, post, riassunti, email, immagini e idee possono essere generati in pochi secondi.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/4cd98ab400659c7316ef4ae770c9c3e2.jpg", "u": "puntate/427-fai-vedere-come-scegli.html", "k": "autorevolezza credibilità fiducia paradata", "g": {"tema": ["fid", "cur"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 426, "t": "Chi è l'Autore Quando Scrivi con l'IA?", "d": "2026-05-31", "s": "Quando scrivo con l’intelligenza artificiale, chi è il vero autore? Io che ho avuto l’idea? La macchina che ha generato le parole? O nasce qualcosa di nuovo, dove la paternità non dipende più solo da chi batte i tasti?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/e35ad82f3774ad291a399dee4499f4b8.jpg", "u": "puntate/426-chi-e-l-autore-quando-scrivi-con-l-ia.html", "k": "authorship autore autorialità floridi ia rodrigues sosa", "g": {"tema": ["ia", "scr"], "percorso": ["ia"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 425, "t": "Verificato da X è la Nuova Stella Michelin", "d": "2026-05-24", "s": "In questa puntata ti racconto una piccola scoperta fatta mentre stavo testando The Curator, un’app open source per costruire una knowledge base personale con l’AI. Da fuori sembrava tutto funzionare bene. L’interfaccia era a posto.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/39aa7a6bc82608e8c5c17162e39d320c.jpg", "u": "puntate/425-verificato-da-x-e-la-nuova-stella-michelin.html", "k": "autorevolezza credibilità curation michelin verificare", "g": {"tema": ["cur", "ia"], "percorso": ["ia"], "serie": ["kb"], "epoca": ["e5"]}, "st": false}, {"n": 424, "t": "Crea Risorse Utili nel Tempo", "d": "2026-05-17", "s": "In un futuro immaginario, tutti possono essere bellissimi. Se l’aspetto non fa più differenza, chi resta nella memoria? Non chi racconta chi è, cosa sa o cosa pensa.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/ecfc61ae7849b9dcafc7da264181f3f5.jpg", "u": "puntate/424-crea-risorse-utili-nel-tempo.html", "k": "autorevolezza contenuti credibilità ia posizionamento seo visibilità", "g": {"tema": ["cont"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 423, "t": "Oltre i Second Brain", "d": "2026-05-10", "s": "In questa puntata racconto una piccola grande idea di Andrej Karpathy: l' LLM-wiki. Invece di usare l’IA per interrogare ogni volta una pila di documenti, Karpathy propone di fare una cosa diversa: usare l’IA per trasformare quei documenti…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/96ada425319013a87dcddb5ed8aa0bda.jpg", "u": "puntate/423-oltre-i-second-brain.html", "k": "ai conoscenza ia intelligenza karpathy knowledge obsidian open-source rezun secondbrain", "g": {"tema": ["cur", "ia"], "percorso": ["ia"], "serie": ["kb"], "epoca": ["e5"]}, "st": false}, {"n": 422, "t": "Cosa Vale Davvero Oggi", "d": "2026-05-03", "s": "Il refrain è sempre lo stesso: Il valore del produrre contenuti sta crollando perché ce ne sono sempre di più. Quello che diventa raro, e quindi prezioso, è un'altra cosa. È il modo in cui scegli, contestualizzi, dai senso.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/7ac7fff31a05fab9139528f7cba2952d.jpg", "u": "puntate/422-cosa-vale-davvero-oggi.html", "k": "content contenuti cultura curation curatore marketing strategia valore", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 421, "t": "Aggiungere Spessore", "d": "2026-04-26", "s": "L’IA non mi serve per scrivere meglio. Mi serve per pensare meglio. In questa puntata racconto perché usare l’IA solo per “fare prima” è utile, sì, ma anche piuttosto limitato.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/764c2afb8f2a28f92a0e6d09db8758b7.jpg", "u": "puntate/421-aggiungere-spessore.html", "k": "ai contenuti ia profondità scrittura spessore", "g": {"tema": ["ia"], "percorso": ["ia"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 420, "t": "Quello Che Nessuno Dice", "d": "2026-04-19", "s": "Chi sono le persone che hanno cambiato il mio modo di pensare alla curation, alla conoscenza e al valore dell’informazione? Negli anni sono state tante le persone che da cui ho imparato, preso esempio, o sono stato ispirato.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/5878700cc328677ec3c59c66510a49e4.jpg", "u": "puntate/420-quello-che-nessuno-dice.html", "k": "credibilità curation fiducia fonti lignaggio maestri trasparenza", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 419, "t": "Lo Strato Mancante", "d": "2026-04-12", "s": "C’è uno spazio invisibile — una specie di “strato mancante” — tra l’essere competente… e l’essere considerato una fonte fidata. E la cosa più controintuitiva? Scrivere di più… non lo riempie. Anzi, a volte lo peggiora.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/f1952692f8864d8e360a6845fbaff2b2.jpg", "u": "puntate/419-lo-strato-mancante.html", "k": "autorevolezza credibilità curation fiducia scrittura", "g": {"tema": ["fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 418, "t": "Allarme Notturno", "d": "2026-04-05", "s": "A volte sentiamo suoni che non ci sono, o ci immaginiamo cose che esistono solo nella nostra testa. E ci facciamo dei grandissimi film.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/ddd67f6edf9e21109e250cadac87600b.jpg", "u": "puntate/418-allarme-notturno.html", "k": "allarme immaginazione notte samui storia uccelli", "g": {"tema": ["sto"], "percorso": ["vita"], "serie": [], "epoca": ["e5"]}, "st": true}, {"n": 417, "t": "Titan il Barbiere di Phang Ka", "d": "2026-03-29", "s": "Qui in Tailandia, ho un mio barbiere di fiducia. Si chiama Titan. E' simpatico, gentile e con le forbici ci sa fare. Ha occhio.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/9a2033556a898461f8ac050698696a5f.jpg", "u": "puntate/417-titan-il-barbiere-di-phang-ka.html", "k": "anfield barbiere calcio liverpool roma seriea thailandia", "g": {"tema": ["sto"], "percorso": ["vita"], "serie": [], "epoca": ["e5"]}, "st": true}, {"n": 416, "t": "Con Gusto", "d": "2026-03-22", "s": "Il gusto non è una questione di opinione. E non è nemmeno qualcosa con cui nasci. È qualcosa che costruisci. In questo episodio parto da un ricordo personale: quando da bambino andavo a comprare vestiti con mia madre.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/a87f67b7fade964a18ff161eac87d2e5.jpg", "u": "puntate/416-con-gusto.html", "k": "gusto mamma scegliere taste", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 415, "t": "5 Capacità l'IA Non Può Rimpiazzare", "d": "2026-03-15", "s": "5 Capacità che l'IA Non Può Rimpiazzare C'è questa domanda che mi gira nella testa da più di un anno: che cosa c’è davvero che l’AI non riesce a fare quando si tratta di curation?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/fbdbe36c29f0ca146e81a4a65ef73a16.jpg", "u": "puntate/415-5-capacita-l-ia-non-puo-rimpiazzare.html", "k": "curation curatori ia rimpiazzabilità umanità", "g": {"tema": ["ia", "cur"], "percorso": ["ia"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 414, "t": "Nicchia e Posizionamento", "d": "2026-03-08", "s": "Se conosci qualcuno alla fermata dell’autobus o mentre stai facendo benzina… e ti raccomanda una cascata da andare a vedere o un libro da leggere, normalmente non gli dai retta. Il motivo?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/b6577c3b635e2f2938e3c90155391b3e.jpg", "u": "puntate/414-nicchia-e-posizionamento.html", "k": "comunicazione marketing nicchia posizionamento strategia", "g": {"tema": ["pos"], "percorso": ["parti"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 413, "t": "Il Metodo dell'Uccello Giardiniere", "d": "2026-03-01", "s": "Ho conosciuto un tipo che fa una cosa assurda per rimorchiare. Fa una specie di mini-mostra artistica nel suo giardino, creando un entrata strafichissima e le ragazze impazziscono.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/62d68cb449c024d6ba6c1c7a181f5989.jpg", "u": "puntate/413-il-metodo-dell-uccello-giardiniere.html", "k": "autorevolezza bowerbird curation fiducia uccellogiardiniere", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 412, "t": "Cartoline Thinking of You", "d": "2026-02-22", "s": "Non è detto che un regalo finisca il suo percorso quando arriva nelle mani del suo destinatario. Un regalo può non solo dare gioia, trasmettere emozioni, farci sentire in contatto con qualcun altro, ma può inaspettatamente essere anche un…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/3c6d84bf0b88bcad8fc669487dee3770.jpg", "u": "puntate/412-cartoline-thinking-of-you.html", "k": "gift howardrheingold painting smartmobs", "g": {"tema": ["sto"], "percorso": ["vita"], "serie": [], "epoca": ["e5"]}, "st": true}, {"n": 411, "t": "Spessore Oltre le Apparenze", "d": "2026-02-15", "s": "Riflessioni inconcludenti ad alta voce, sull'atmosfera di performance che ha iniziato a pervadere molti dei contenuti online. Tanto luccichio, ma poco spessore ed autenticità.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/24a0ac823892614b5df83b1a77722f30.jpg", "u": "puntate/411-spessore-oltre-le-apparenze.html", "k": "contenuti lp performance", "g": {"tema": ["cont", "fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 410, "t": "Mostrare Il Dietro le Quinte: Paradata", "d": "2026-02-08", "s": "Quando racconti non tanto il risultato finale, l’idea, la realizzazione, la prospettiva o il nuovo metodo che hai progettato, ma - la storia di come ci sei arrivato, cosa ti ha spinto, che passi hai fatto, che errori ti hanno fermato e via…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/233e5bdb18ab76df04848afc77ce6ee6.jpg", "u": "puntate/410-mostrare-il-dietro-le-quinte-paradata.html", "k": "coppola curation paradata", "g": {"tema": ["fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 409, "t": "Saggia Selezione", "d": "2026-02-01", "s": "La \"saggia selezione\" (wise winnowing) è un approccio al creare e innovare attraverso l'abbondanza di alternative. In parole povere: Laddove un esperto ha accumulato un enorme quantità di dati e pattern in un certo settore specifico,…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/52f97c7144f9c6816a99ac00d66356e2.jpg", "u": "puntate/409-saggia-selezione.html", "k": "compilation cristallizata curation intelligenza montaggio scegliere università videomusicali", "g": {"tema": ["cur"], "percorso": ["trov"], "serie": [], "epoca": ["e5"]}, "st": false}, {"n": 408, "t": "La Mia Love Story con la Curation", "d": "2026-01-25", "s": "Da dove nasce la mia passione profonda per la curation? In realtà non è qualcosa che ho scoperto di recente, ma un’attitudine che, pian piano, senza rendermene conto, ho iniziato inconsapevolmente a sviluppare sin da piccolo.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/289a86c952162b1dbe5f118ac633f454.jpg", "u": "puntate/408-la-mia-love-story-con-la-curation.html", "k": "curatela curation discj ria di vantaggio competitivo. Specialmente qui in Italia. L'arte dell'accoglienza ce l'abbiamo nel DNA, è tutto intorno a noi, ma quando siamo noi ad offrire un servizio/prodotto…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/10cc5802d6b9ad8d38bad82796b945d9.jpg", "u": "puntate/109-come-distinguersi-attraverso-il-customer-service.html", "k": "comunicazione contentmarketing credibilità customerservice imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["cli"], "percorso": ["tieni"], "serie": ["custserv"], "epoca": ["e2"]}, "st": false}, {"n": 108, "t": "Come attivare una comunità online", "d": "2020-04-12", "s": "Come fare per \"attivare\" un gruppo Facebook o una comunità di persone online? Chi apre un Gruppo su Facebook (o su un'altra piattaforma social) ha come primario interesse quello di entrare in contatto più diretto con coloro che sono…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/306eda09e941bec7dfdfa1b2f059e6bd.jpg", "u": "puntate/108-come-attivare-una-comunita-online.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc", "cli"], "percorso": ["tieni"], "serie": [], "epoca": ["e2"]}, "st": false}, {"n": 107, "t": "Linguaggio: Io e Tu vs. Noi e Voi", "d": "2020-04-05", "s": "Cosa è meglio? Usare l’io e il tu nel presentare un podcast o un video, o usare il io/noi e voi? Come la penso: ◾Chi mi ascolta è da solo. Le persone non si radunano in gruppi per ascoltare le puntate del mio podcast o i miei video.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/1ba96e4d835e24f4cebd7dc0c89435c1.jpg", "u": "puntate/107-linguaggio-io-e-tu-vs-noi-e-voi.html", "k": "comunicazione cont : "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/91b6eecc5ca322b9a4e87e967f96dd27.jpg", "u": "puntate/47-organizzazione-produzione-contenuti-per-i-social.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc", "cont"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 46, "t": "Bandiere Sociali: Identikit", "d": "2019-01-20", "s": "Che cosa sono le bandiere sociali? A che servono? Come son fatte? Come le riconosco? A chi potrebbero essere utili? Queste le domande specifiche.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/8e59bf6ff71a71a73b2b00dfe3a5ff7a.jpg", "u": "puntate/46-bandiere-sociali-identikit.html", "k": "bandieresociali comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 45, "t": "Tre Domande Prima di Lanciarsi", "d": "2019-01-13", "s": "Prima di lanciarsi in un progetto online in veste di imprenditori, è bene ponderare con attenzione dove si intende andare, come, ma soprattutto se ci sono le condizioni per poter creare qualcosa che fa effettivamente la differenza.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/bac5ac6fdbfcdcfe6f3b99e371a2cd8a.jpg", "u": "puntate/45-tre-domande-prima-di-lanciarsi.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing startup strategia webmarketing", "g": {"tema": ["ind"], "percorso": ["parti"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 44, "t": "Strategia per Contenuti di Valore", "d": " comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding pianificazione reputazione sitoweb socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["pos"], "percorso": ["parti"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 41, "t": "Social Media Ben Fatto: Nutrizionista-BIO", "d": "2018-12-17", "s": "Robin, mi fai vedere un esempio di una pagina social che, almeno in parte, fa quello che suggerisci tu? Condividere contenuti di valore e coltivare relazioni di lunga durata. Certamente.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/4bc17afb1801503a7409925207a86041.jpg", "u": "puntate/41-social-media-ben-fatto-nutrizionista-bio.html", "k": "casistudio comunicazione contentmarketing credibilità facebook imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 40, "t": "Dammi feedback", "d": "2018-12-06", "s": "Come miglioreresti questo podcast? Cosa va benissimo, e cosa invece no? Fammi sentire la tua voce. Ho inaugurato un nuovo canale dove potermi far sentire i tuoi commenti, le tue idee, e le tue richieste relative a questo podcast.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/8b566627de859645ebd8b5b65c8e21a6.jpg", "u": "puntate/40-dammi-feedback.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["pod"], "percorso": ["tieni"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 39, "t": "Crowdpartnering", "d": "2018-11-05", "s": "Eleggere i propri migliori clienti e lettori a \"partner\", dandogli la possibilità di suggerire, proporre e valutare idee, prodotti e servizi che la tua azienda offre.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/9ee9879a7bc967fb712861d63ab0e54c.jpg", "u": "puntate/39-crowdpartnering.html", "k": "comunicazione contentmarketing credibilità crowdpartner crowdpartnering imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["cli"], "percorso": ["tieni"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 38, "t": "Uscire dallo schermo - p2 logistica", "d": "2018-10-29", "s": "Come organizzare fattivamente un tour organizzato dal basso, dai propri lettori, fan e clienti. Cosa ho scoperto e quali piccole lezioni ho appreso organizzando questi 38 eventi nell'arco dei tre mini-tour che ho portato in giro per…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/18fd4bbd0364f8514c77f60dedf29d0f.jpg", "u": "puntate/38-uscire-dallo-schermo-p2-logistica.html", "k": "comunicazione contentmarketing credibilità crowdtouring dabrandafriend imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia tour webmarketing", "g": {"tema": ["cli"], "percorso": ["tieni"], "serie": ["schermo"], "epoca": ["e1"]}, "st": false}, {"n": 37, "t": "Uscire dallo schermo", "d": "2018-10-23", "s": "Se è vero che coltivare le relazioni con i lettori e i clienti è così importante, perché non organizzare - insieme a loro - un bel giro per andarli a trovare tutti quanti? .", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/d32b02ba7262d2ba0806e41cd548788a.jpg", "u": "puntate/37-uscire-dallo-schermo.html", "k": "comunicazione contentmarketing credibilità fareuntour imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing socialtouring strategia usciredalloschermo webmarketing", "g": {"tema": ["cli"], "percorso": ["tieni"], "serie": ["schermo"], "epoca": ["e1"]}, "st": false}, {"n": 36, "t": "Avviare un podcast da zero", "d": "2018-10-05", "s": "Cosa serve per avviare un podcast da zero? In realtà non serve quasi nulla. A parte l’avere un buon microfono e il sottoscrivere l’abbonamento ad un servizio che ti semplifichi la pubblicazione e la distribuzione online, tutto il resto…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/5a168957c25e6ff345f2d020c5be30c1.jpg", "u": "puntate/36-avviare-un-podcast-da-zero.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding podcasting reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["pod"], "percorso": ["parti"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 35, "t": "Far decollare pagina FB da zero", "d": "2018-09-27", "s": "Come fare per far decollare una pagina FB che parte da zero? Che consigli e suggerimenti dò abitualmente ai miei studenti e partner?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/86749cb1132acd814d1526c058729c49.jpg", "u": "puntate/35-far-decollare-pagina-fb-da-zero.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing paginafacebook personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 34, "t": "La piramide rovesciata", "d": "2018-09-18", "s": "Il miglior modo per poter facilitare la lettura di un contenuto, sulla carta e online, è quello di comunicare subito ed in maniera sintetica di cosa quel contenuto tratta dando una sintesi dei principali dettagli già nelle primissime…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/767e04040fc7c703a24c7b26dd5a42b5.jpg", "u": "puntate/34-la-piramide-rovesciata.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia tag: webmarketing", "g": {"tema": ["scr"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 33, "t": "Il tuo logo su Facebook", "d": "2018-09-10", "s": "Un dettaglio così semplice e così tanto trascurato. Basta così poco per far avere un marchio immediatamente riconoscibile da chiunque, ogni volta che incrocia un tuo post, eppure in tanti trascurano ancora di notare l’evidenza.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/9dc0df72cc5e1f6a807b8e5c9f33875d.jpg", "u": "puntate/33-il-tuo-logo-su-facebook.html", "k": "branding comunicazione contentmarketing credibilità imprenditoria logo marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc", "pos"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 32, "t": "Content marketing di spessore", "d": "2018-09-03", "s": "Come faccio a creare contenuti veramente eccezionali e diversi da quelli dei miei concorrenti, nella mia stessa nicchia di mercato? Ho cominciato a scrivere articoli e post più lunghi, ma sono a corto di idee, cosa mi consigli di fare?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/fdad7969d35a907f0ede2dfb368f3858.jpg", "u": "puntate/32-content-marketing-di-spessore.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["cont"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 31, "t": "Strategia per Facebook", "d": "2018-08-27", "s": "Su cosa investire per chi continua a puntare su Facebook? A quali elementi dare maggior peso e che approccio generale usare per ottenere risultati efficaci e duratori nel tempo?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/b3dfc6043d59da344e132ebc19d8b4f4.jpg", "u": "puntate/31-strategia-per-facebook.html", "k": "comunicazione contentmarketing credibilità facebook imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 30, "t": "Fuga da Facebook", "d": "2018-08-20", "s": "L'annuncio di FB è della settimana scorsa: \"A noi di mandare traffico ai vostri siti e brand, non ci interessa. Quello era il passato. Non si torna più indietro.\" Se mantieni una pagina FB te ne sarai accorto da solo.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/49d25b4e0a4fd642b90b1c1c031e139f.jpg", "u": "puntate/30-fuga-da-facebook.html", "k": "comunicazione contentmarketing credibilità facebook imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 29, "t": "Paura di condividere", "d": "2018-08-13", "s": "Condividere spesso viene visto come un rischio... si ha paura che qualcun altro sfrutti o valorizzi ciò che abbiamo trovato, prima (e meglio) di noi.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/cd255cd3d1561a3daebfbb658808695c.jpg", "u": "puntate/29-paura-di-condividere.html", "k": "comunicazione condivisione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["cur", "fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 28, "t": "Bello o autentico?", "d": "2018-08-06", "s": "Cosa è meglio? Costruire un grande marchio o far apprezzare di più chi c'è dietro? Grande apparenza o grande credibilità? Da un lato c’è il modo classico di fare comunicazione e marketing, che consiste nello spersonalizzare il brand (non…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/fdf5e8bec49132d5a6fbfcd235d28895.jpg", "u": "puntate/28-bello-o-autentico.html", "k": "brand branding comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 27, "t": "Delegare i social a terzi", "d": "2018-07-29", "s": "Il problema è che, a mio umile avviso, per ottenere risultati sui social, per poter essere realmente apprezzati e seguiti, la strada più efficace è quella di “far sentire la propria voce”, di essere autentici, sinceri e genuini.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/93c9f88eb8ca28f97b448b530f1735fb.jpg", "u": "puntate/27-delegare-i-social-a-terzi.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione socialmedia socialmediamarketing strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 26, "t": "Come prepararsi per un video", "d": "2018-07-23", "s": "La cosa migliore che si possa fare per prepararsi a girare un video è lo scrivere ciò che si vorrà dire nel video. Ma non per leggerlo.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/dcbe76e637a21f52bd475de65d03384c.jpg", "u": "puntate/26-come-prepararsi-per-un-video.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione strategia video webmarketing", "g": {"tema": ["scr"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 25, "t": "Come trovare rapidamente nuovi clienti", "d": "2018-07-17", "s": "La strada più semplice da percorrere per avere da subito, nuovo clienti, potenzialmente interessanti e affidabili, è quella di chiedere ai propri clienti soddisfatti.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/a3d7fe14d1d23811d4e86f52fb33857e.jpg", "u": "puntate/25-come-trovare-rapidamente-nuovi-clienti.html", "k": "", "g": {"tema": ["cli"], "percorso": ["guad"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 24, "t": "Condividere tutto, vende", "d": "2018-07-09", "s": "Condividere tutto ciò che sai, paga. Dare informazioni limitate, di scarso spessore e non dicendo tutto quello si sa per timore di non aver nulla da mettere nelle proprie offerte a pagamento, limita fortemente le proprie opportunità di…", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/79624a8399a35099e3a60f4ab7894e71.jpg", "u": "puntate/24-condividere-tutto-vende.html", "k": "comunicazione contentmarketing credibilità imprenditoria marketing onlinemarketing personalbranding reputazione strategia webmarketing", "g": {"tema": ["fid", "cont"], "percorso": ["sceg"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 23, "t": "Social o sito? Dove far leggere i tuoi contenuti", "d": "2018-07-03", "s": "Perché portarli a casa? Invitali fuori. Una delle abitudini, più diffuse, ma meno messe in discussione è quella di spingere, forzare il lettore nel venire sul tuo sito, sul tuo blog o nel vedere un certo tuo video. Ma perché?", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/27cb6a8944445d6e6cc8312f635dc35b.jpg", "u": "puntate/23-social-o-sito-dove-far-leggere-i-tuoi-contenuti.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 22, "t": "Come comunicare per creare relazioni", "d": "2018-06-26", "s": "C’è un modo particolare di scrivere per favorire lo sbocciare e il mantenere relazioni con i tuoi clienti e potenziali tali? Si che c’è.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/ae0c6f02ade21e21269a0d1783ee4d87.jpg", "u": "puntate/22-come-comunicare-per-creare-relazioni.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["scr", "cli"], "percorso": ["tieni"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 21, "t": "Come iniziare qualsiasi testo: Ciccia subito", "d": "2018-06-20", "s": "La piramide rovesciata è un approccio al fare giornalismo, news reporting nello specifico, può essere adottato benissimo e con estrema efficacia nel approccio editoriale utilizzato su siti, blog e soprattutto sui social media come Facebook.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/cdaa5c9c09aec774ede0e138fdf68d88.jpg", "u": "puntate/21-come-iniziare-qualsiasi-testo-ciccia-subito.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["scr"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 20, "t": "Venditori di fuffa: Come evitare di apparire tali", "d": "2018-06-14", "s": "Il rischio di adottare stili e modi di comunicare che non ci appartengono è quello di passare poi per persone differenti da quelle che siamo.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/d644255e6240cee20471b962a1567812.jpg", "u": "puntate/20-venditori-di-fuffa-come-evitare-di-apparire-tali.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["scr", "fid"], "percorso": ["sceg"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 19, "t": "Come scendere dal *piedistallo*", "d": "2018-06-08", "s": "Come fare per non apparire \"saccenti\", presuntuosi, e \"professori\" quando si desidera condividere consigli e suggerimenti con il proprio pubblico.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/22db526318206161602b7596b8a2e573.jpg", "u": "puntate/19-come-scendere-dal-piedistallo.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["scr"], "percorso": ["sceg"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 18, "t": "Quando ti dicono \"non-c'è problema\" stai certo che...", "d": "2018-05-31", "s": "Se ti dicono \"non c'è problema\" accendi tutti i sensori, perché il più delle volte, \"non c'è problema\" corrisponde a \"problema in arrivo\".", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/1b549a1597eeada7caabd2ab93a6133e.jpg", "u": "puntate/18-quando-ti-dicono-non-c-e-problema-stai-certo-che.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["cli"], "percorso": ["sceg"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 17, "t": "Come creare promozioni grafiche che funzionano su Facebook", "d": "2018-05-27", "s": "Creare promozioni grafiche che siano efficaci su FB e sugli altri social è inversamente proporzionale alla quantità di testo e di elementi grafici che ci metti. Più roba ci metti e più la enfatizzi, e meno mi arriva a me che ti leggo.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/5a655dacd9c5790b2203dffe09257f69.jpg", "u": "puntate/17-come-creare-promozioni-grafiche-che-funzionano-su-facebook.html", "k": "comunicazione comunicazionevisiva contentmarketing design facebook grafica imprenditoria marketing onlinemarketing personalbranding promozione strategia webmarketing", "g": {"tema": ["soc"], "percorso": ["trov"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 16, "t": "Saper chiedere feedback", "d": "2018-05-21", "s": "Ricevo tantissime richieste di feedback, di valutazione e di consiglio su siti web, pagine Facebook, così come su bozze di promozioni e pubblicità ancora da pubblicare.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/cdc4a0da437482cb71d0466e51e254f8.jpg", "u": "puntate/16-saper-chiedere-feedback.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["cli"], "percorso": ["tieni"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 15, "t": "Il marchio di qualità: le domande che fai", "d": "2018-05-18", "s": "I business e le attività commerciali di vero spessore sono immediatamente riconoscibili da una caratteristica peculiare: domandano, chiedono pro-attivamente feedback specifico ai loro clienti.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/46aa6a9a060c0377cbf021327e96d743.jpg", "u": "puntate/15-il-marchio-di-qualita-le-domande-che-fai.html", "k": "comunicazione contentmarketing imprenditoria marketing onlinemarketing personalbranding strategia webmarketing", "g": {"tema": ["cli"], "percorso": ["tieni"], "serie": [], "epoca": ["e1"]}, "st": false}, {"n": 14, "t": "Info a chiocciola: indirizzi mail quando si fa business online", "d": "2018-04-06", "s": "Moltissime attività commerciali comunicano con i loro clienti attraverso una casella mail del tipo info@aziendaX.it. Non mi sono mai trovato bene con queste aziende. Non so con chi sto dialogando, non capisco chi mi scrive.", "i": "https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/d61236b9de4230528 const P=new URLSearchParams(location.search);
let view=P.get("v")||"tema", grp=P.get("g")||"";
const $=id=>document.getElementById(id), q=$("q");
const byN=Object.fromEntries(D.eps.map(e=>[e.n,e]));
const gname={};D.views.forEach(v=>v.groups.forEach(g=>gname[v.id+":"+g.id]=g.n));
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function card(e){const tags=(e.g.tema||[]).map(t=>`<span class="tag">${esc(gname["tema:"+t])}</span>`).join("")
  +(e.g.serie||[]).map(s=>`<span class="tag serie">${esc(gname["serie:"+s])}</span>`).join("")+(e.st?'<span class="tag story">Storia</span>':"");
  return `<a class="card" href="${e.u}"><img src="${esc(e.i)}" alt="" loading="lazy"><div class="b"><div class="meta">#${e.n} · ${fd(e.d)}</div>
  <h3>${esc(e.t)}</h3><p>${esc(e.s)}</p><div class="tags">${tags}</div></div></a>`}
$("startrow").innerHTML=D.start.map(n=>byN[n]).filter(Boolean).map(card).join("");
$("views").insertAdjacentHTML("beforeend",D.views.map(v=>`<button class="view" data-v="${v.id}">${esc(v.name)}</button>`).join(""));
function chips(){const v=D.views.find(x=>x.id===view)||D.views[0];
  const cnt=g=>D.eps.filter(e=>(e.g[v.id]||[]).includes(g)).length;
  $("chips").innerHTML='<button class="chip" data-g="">Tutte</button>'+v.groups.map(g=>`<button class="chip" data-g="${g.id}">${esc(g.n)}<small>${cnt(g.id)}</small></button>`).join("");
  document.querySelectorAll(".view").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view));}
function render(){
  const t=norm(q.value), v=D.views.find(x=>x.id===view);
  let list=D.eps.filter(e=>(!grp||(e.g[view]||[]).includes(grp))&&(!t||norm(e.t+" "+e.s+" "+e.k+" #"+e.n).includes(t))&&!($("nostory").checked&&e.st));
  if($("oldfirst").checked||(view==="serie"&&grp))list=list.slice().sort((a,b)=>a.n-b.n);
  $("count").textContent=list.length+" puntate";
  const g=v&&v.groups.find(x=>x.id===grp); $("catdesc").textContent=g?g.d:"";
  $("start").style.display=(grp||t)?"none":"";
  $("grid").innerHTML=list.map(card).join("");
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===grp));
  const u=new URLSearchParams();if(view!=="tema")u.set("v",view);if(grp)u.set("g",grp);history.replaceState(null,"",u.toString()?"?"+u:location.pathname);
}
$("views").onclick=ev=>{const b=ev.target.closest(".view");if(!b)return;view=b.dataset.v;grp="";chips();render()};
$("chips").onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;grp=b.dataset.g;render()};
q.oninput=render;$("nostory").onchange=render;$("oldfirst").onchange=render;
chips();render();
</script></body></html>
