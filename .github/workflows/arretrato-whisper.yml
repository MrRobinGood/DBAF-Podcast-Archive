name: Trascrivi arretrato con Whisper

# Trascrive con Whisper le puntate che non hanno ancora un testo, 12 alla volta.
# Parte da solo ogni 6 ore: quando non resta nulla da fare, finisce in pochi secondi.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Quante puntate trascrivere in questo giro"
        default: "12"

permissions:
  contents: write

jobs:
  trascrivi:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Serve lavorare?
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          eps = json.loads(Path("data/episodes.json").read_text())
          missing = [e["number"] for e in eps if not Path(f"transcripts/{e['number']:03d}.md").exists()]
          print(f"missing={len(missing)}")
          PY
      - uses: actions/setup-python@v5
        if: steps.check.outputs.missing != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - if: steps.check.outputs.missing != '0'
        run: pip install -r requirements.txt
      - name: Trascrivi
        if: steps.check.outputs.missing != '0'
        run: python3 scripts/transcribe_whisper.py --limit "${{ github.event.inputs.limit || '12' }}"
      - name: Ricostruisci il sito e salva
        if: steps.check.outputs.missing != '0'
        run: |
          python3 scripts/build_site.py
          git config user.name "dbaf-bot"
          git config user.email "dbaf-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Trascrizioni Whisper (arretrato)"
          git pull --rebase
          git push
