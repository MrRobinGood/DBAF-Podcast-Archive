name: Impronte copertine
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archivio
  cancel-in-progress: false
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/cover_hashes.py
      - run: |
          git config user.name "dbaf-bot"
          git config user.email "dbaf-bot@users.noreply.github.com"
          git add data/cover_hashes.json
          git diff --cached --quiet || git commit -m "Impronte copertine"
          git pull --rebase
          git push
